[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisda-sim"
version = "1.0.0"
description = "Mechanism-level simulator for the CISDA architecture"
requires-python = ">=3.10"

[project.scripts]
cisda-sim = "cisda_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
